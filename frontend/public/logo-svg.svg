<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="100%" height="100%">
  <defs>
    <!-- Filter to simulate hand-drawn brush texture and rough edges -->
    <filter id="brush-roughness" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Laptop Icon Group -->
    <g filter="url(#brush-roughness)" fill="#FF5E2B" stroke="#FF5E2B" stroke-linecap="round" stroke-linejoin="round">
      
      <!-- Outer Screen Frame / Border -->
      <path d="M 105,75 Q 200,68 295,72 C 305,73 300,85 290,85 Q 200,80 110,85 Z" />
      <path d="M 115,70 Q 200,65 285,68 C 295,69 290,78 280,78 Q 195,73 115,75 Z" />
      
      <path d="M 90,85 Q 85,150 112,210 C 115,217 125,210 122,200 Q 98,150 102,90 Z" />
      <path d="M 98,80 Q 92,145 118,215 C 122,220 128,212 125,205 Q 102,148 108,85 Z" />
      
      <path d="M 288,75 Q 312,140 290,215 C 285,222 275,215 278,205 Q 298,140 278,80 Z" />
      <path d="M 295,80 Q 318,145 296,220 C 290,225 282,218 284,210 Q 305,145 285,82 Z" />

      <path d="M 120,205 Q 200,208 280,202 C 288,201 288,212 278,213 Q 198,218 118,214 Z" />
      
      <!-- Diagonal Screen Glare / Brush Stroke -->
      <path d="M 130,190 C 135,170 180,140 255,85 C 265,78 275,90 265,100 C 195,155 150,185 140,200 C 132,208 122,200 130,190 Z" />
      <path d="M 145,185 C 150,175 190,145 245,100 C 252,94 260,102 252,110 C 198,152 160,180 150,190 Z" opacity="0.7" />

      <!-- Keyboard Base -->
      <path d="M 115,225 Q 200,223 280,224 C 288,224 288,235 278,236 Q 198,235 115,237 C 105,237 105,225 115,225 Z" />
      <path d="M 120,232 L 275,230 C 285,230 288,245 278,248 L 125,250 C 112,250 110,232 120,232 Z" />

      <!-- Lower Laptop Body -->
      <path d="M 75,265 C 100,230 115,230 125,230 L 270,230 C 285,230 300,240 330,260 C 345,270 330,285 305,285 L 85,295 C 60,295 55,280 75,265 Z" />
      
      <!-- Trackpad Outline -->
      <path d="M 160,268 Q 200,266 235,268 Q 237,276 233,280 Q 198,282 162,280 Q 158,274 160,268 Z" fill="#FFFFFF" stroke="#FF5E2B" stroke-width="3" />

    </g>

    <!-- BLOGWEB Text -->
    <text x="350" y="210" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="78" font-weight="bold" fill="#FF5E2B" letter-spacing="2">BLOGWEB</text>
  </g>
</svg>